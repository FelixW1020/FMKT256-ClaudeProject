name: Refresh data

# Weekdays after the US close: pull Yahoo Finance and FRED, re-estimate both lenses, commit data/latest.json.
# GitHub Pages redeploys the site from the new commit, so viewers always load the latest refresh.
on:
  schedule:
    - cron: '17 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Fetch, re-estimate and write data/latest.json
        run: python scripts/update_data.py
      - name: Commit the refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Data refresh $(date -u +'%Y-%m-%d')"
          git push
